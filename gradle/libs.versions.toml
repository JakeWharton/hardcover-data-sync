[versions]
okhttp = "5.5.0"

[libraries]
kotlin-gradlePlugin = "org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.10"

spotless-gradlePlugin = "com.diffplug.spotless:spotless-plugin-gradle:8.10.2"
ktlint = "com.pinterest.ktlint:ktlint-cli:1.8.0"

kotlinx-serialization-json-okio = "org.jetbrains.kotlinx:kotlinx-serialization-json-okio:1.11.0"

okhttp-client = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }

clikt = "com.github.ajalt.clikt:clikt:5.1.0"
cardiologist = "io.github.kevincianfarini.cardiologist:cardiologist:0.8.0"
