[versions]
okhttp = "5.2.1"

[libraries]
kotlin-gradlePlugin = "org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.21"

spotless-gradlePlugin = "com.diffplug.spotless:spotless-plugin-gradle:8.0.0"
ktlint = "com.pinterest.ktlint:ktlint-cli:1.7.1"

kotlinx-serialization-json-okio = "org.jetbrains.kotlinx:kotlinx-serialization-json-okio:1.9.0"

okhttp-client = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }

clikt = "com.github.ajalt.clikt:clikt:5.0.3"
